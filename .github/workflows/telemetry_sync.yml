name: Telemetry Sync Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: telemetry-sync-pipeline
  cancel-in-progress: false

jobs:
  sync-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Pre-Flight Configuration Check
        shell: bash
        env:
          CORE_REPO: ${{ secrets.CORE_REPO }}
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CORE_REPO" ] || [ -z "$CORE_REPO_TOKEN" ]; then
            echo "::error::Missing required repository secrets."
            exit 1
          fi

      - name: Checkout Core Package
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CORE_REPO }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: _pkg
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Runtime Packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi websockets redis pynacl playwright playwright-stealth pyotp

      - name: Cache Browser Runtime
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-v1-${{ runner.os }}

      - name: Install Browser Runtime
        if: steps.browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          playwright install chromium

      - name: Restore Persistent Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _pkg/sync_state.bin.gz
            _pkg/worker_logs
            _pkg/auth_state.json
          key: sync-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sync-state-v1-

      - name: Run Sync Worker
        working-directory: _pkg
        shell: bash
        env:
          CORE_REPO: ${{ secrets.CORE_REPO }}
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
          ENTRY_SCRIPT: ${{ secrets.ENTRY_SCRIPT || 'sync_engine.py' }}
          MAX_RUNTIME_SECONDS: "19800"
          ENABLE_STATE_PERSISTENCE: "true"
          PERSIST_STATE_FILE: "sync_state.bin.gz"
          LOG_DIR: "worker_logs"
          USE_PROXY: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ ! -f ".env" ]; then
            echo "::error::Missing .env file in private repository."
            exit 1
          fi
          chmod 600 .env
          # Strict network-route guardrail (verifies proxy config is present before launching)
          python - <<'PY'
          vals = {}
          for line in open(".env", encoding="utf-8"):
              s = line.strip()
              if not s or s.startswith("#") or "=" not in s:
                  continue
              k, v = s.split("=", 1)
              vals[k.strip()] = v.strip().strip('"').strip("'")
          if vals.get("USE_PROXY", "").lower() not in ("true", "1", "yes") or not vals.get("PROXY_IPS"):
              raise SystemExit("Network route guard failed: proxy pool missing.")
          PY
          python -u "$ENTRY_SCRIPT"

      - name: Save Persistent Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            _pkg/sync_state.bin.gz
            _pkg/worker_logs
            _pkg/auth_state.json
          key: sync-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune Older Caches
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
        run: |
          sleep 3
          python - <<'PY'
          import json, os, urllib.request
          repo = "${{ github.repository }}"
          token = os.environ.get("GH_TOKEN", "")
          prefix = "sync-state-v1-"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/caches?per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  all_caches = json.loads(r.read().decode("utf-8")).get("actions_caches", [])
              matched = [c for c in all_caches if str(c.get("key", "")).startswith(prefix)]
              matched.sort(key=lambda c: str(c.get("created_at", "")), reverse=True)
              print(f"Found {len(matched)} cache(s) for prefix {prefix}")
              # Keep only the 1 newest cache; delete all older ones
              deleted = 0
              for c in matched[1:]:
                  cid = c.get("id")
                  if not cid:
                      continue
                  dreq = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/caches/{cid}",
                      headers=headers,
                      method="DELETE",
                  )
                  try:
                      urllib.request.urlopen(dreq, timeout=15).read()
                      deleted += 1
                  except Exception as exc:
                      print(f"Could not delete cache {cid}: {exc}")
              print(f"Pruned {deleted} older cache(s); kept {min(1, len(matched))} latest.")
          except Exception as exc:
              print(f"Cache prune skipped: {exc}")
          PY

      - name: Cleanup Workspace
        if: always()
        shell: bash
        run: |
          rm -rf _pkg

      - name: Schedule Next Run
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/telemetry_sync.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
